<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Rock, Paper, Scissors</h1>
        <p>First to 5 wins!</p>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">✊<br>Rock</button>
            <button class="choice-btn" data-choice="paper">🖐️<br>Paper</button>
            <button class="choice-btn" data-choice="scissors">✌️<br>Scissors</button>
        </div>
        
        <div class="result-area">
            <div class="player-choice">
                <p>You Chose:</p>
                <span id="playerPick" class="pick">❓</span>
            </div>
            <div class="vs">VS</div>
            <div class="computer-choice">
                <p>Computer chose:</p>
                <span id="computerPick" class="pick">❓</span>
            </div>
        </div>

        <p id="roundResult" class="round-result"></p>
        
        <div class="scoreboard">
            <div class="score">
                <span class="label">You</span>
                <span id="playerScore" class="score-num">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span id="computerScore" class="score-num">0</span>
            </div>
        </div>
        
        <button id="resetBtn" class="reset-btn hidden">Play Again</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
